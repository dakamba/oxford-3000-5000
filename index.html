<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxford 3000 и 5000</title>
  <style>
    :root {
      --bg: #eef1ec;
      --card: #fbfcfa;
      --ink: #17201c;
      --muted: #5f6d64;
      --line: #c9d3cb;
      --accent: #1f6b5b;
      --accent-2: #2f7d4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    h1 {
      margin: 0;
      font-family: Georgia, Times, serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
    }
    .muted { color: var(--muted); }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }
    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin: 22px 0 18px;
      flex-wrap: wrap;
    }
    .tab {
      border: 0;
      padding: 10px 12px;
      background: transparent;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font: inherit;
    }
    .tab.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    select, button, input {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      padding: 9px 12px;
    }
    button {
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    button.green {
      background: var(--accent-2);
      border-color: var(--accent-2);
      color: white;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: 210px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      user-select: none;
    }
    .word {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: 700;
      line-height: 1.2;
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .list {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .row:last-child { border-bottom: 0; }
    .row strong { font-size: 1.05rem; }
    .search { width: 100%; margin-bottom: 12px; }
    #options {
      display: grid;
      grid-template-columns: repeat(2, minmax(140px, 1fr));
      gap: 10px;
      width: 100%;
      margin-top: 10px;
    }
    .opt {
      text-align: left;
      padding: 12px 14px;
    }
    .good { color: #1f7a45; font-weight: 700; }
    .bad { color: #b4372f; font-weight: 700; }
    @media (max-width: 560px) {
      #options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Oxford 3000 и 5000</h1>
        <div class="muted">Карточки, тесты и словарь для запоминания</div>
      </div>
      <div class="muted" id="progress">0 / 0</div>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="cards" type="button">Карточки</button>
      <button class="tab" data-tab="quiz" type="button">Тест</button>
      <button class="tab" data-tab="dict" type="button">Словарь</button>
    </nav>

    <section class="panel active" id="cards">
      <div class="toolbar">
        <select id="filter">
          <option value="all">Все слова</option>
          <option value="new">Новые</option>
          <option value="known">Изученные</option>
        </select>
        <button id="shuffle" type="button">Перемешать</button>
      </div>
      <div class="card" id="flashcard" tabindex="0" role="button" aria-label="Показать перевод">
        <div class="word" id="front">word</div>
        <div class="muted" id="back">Нажмите, чтобы увидеть перевод</div>
      </div>
      <div class="actions">
        <button type="button" id="prev">←</button>
        <button type="button" id="repeat">Повторить</button>
        <button type="button" class="green" id="know">Знаю</button>
        <button type="button" id="next">→</button>
      </div>
    </section>

    <section class="panel" id="quiz">
      <div class="toolbar">
        <button class="primary" type="button" id="startQuiz">Начать тест</button>
        <span class="muted" id="score">0 правильных</span>
      </div>
      <div class="card">
        <div class="word" id="question">Нажмите «Начать тест»</div>
        <div id="options"></div>
        <div id="feedback" class="muted"></div>
      </div>
    </section>

    <section class="panel" id="dict">
      <input class="search" id="search" type="search" placeholder="Поиск по слову или переводу" />
      <div class="list" id="dictList"></div>
    </section>
  </div>

  <script>
    const WORDS = [
      ['ability','способность'], ['about','о'], ['accept','принимать'], ['across','через'], ['act','действовать'], ['action','действие'],
      ['active','активный'], ['address','адрес'], ['adult','взрослый'], ['advice','совет'], ['afford','позволить себе'], ['afraid','бояться'],
      ['after','после'], ['again','снова'], ['agree','соглашаться'], ['air','воздух'], ['airport','аэропорт'], ['alive','живой'],
      ['allow','разрешать'], ['almost','почти'], ['always','всегда'], ['among','среди'], ['amount','количество'], ['animal','животное'],
      ['answer','ответ'], ['appear','появляться'], ['apple','яблоко'], ['area','область'], ['argue','спорить'], ['arrive','прибывать'],
      ['art','искусство'], ['ask','спросить'], ['beautiful','красивый'], ['because','потому что'], ['become','становиться'], ['before','до'],
      ['begin','начинать'], ['believe','верить'], ['best','лучший'], ['better','лучше'], ['between','между'], ['book','книга'],
      ['build','строить'], ['business','бизнес'], ['change','изменение'], ['child','ребенок'], ['city','город'], ['come','приходить'],
      ['computer','компьютер'], ['different','разный'], ['education','образование'], ['environment','окружающая среда'], ['experience','опыт'],
      ['family','семья'], ['important','важный'], ['language','язык'], ['learn','учиться'], ['people','люди'], ['question','вопрос'],
      ['read','читать'], ['school','школа'], ['understand','понимать'], ['work','работа'], ['write','писать']
    ];

    const STORAGE_KEY = 'oxford3000_status';
    let status = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    let deck = WORDS.map((_, idx) => idx);
    let pos = 0;
    let flipped = false;
    let quizIndex = 0;
    let quizScore = 0;

    const $ = (sel) => document.querySelector(sel);

    function setStatus(wordIndex, value) {
      if (value) status[wordIndex] = value;
      else delete status[wordIndex];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(status));
      updateProgress();
      renderDeck();
      renderDict();
    }

    function updateProgress() {
      const known = Object.keys(status).length;
      $('#progress').textContent = `${known} / ${WORDS.length}`;
    }

    function cardList(filter = $('#filter').value) {
      return WORDS.map((_, i) => i).filter(i => {
        if (filter === 'known') return !!status[i];
        if (filter === 'new') return !status[i];
        return true;
      });
    }

    function renderDeck() {
      const filter = $('#filter').value;
      let list = cardList(filter);
      if (!list.length) {
        $('#front').textContent = 'Нет слов';
        $('#back').textContent = 'Измените фильтр';
        return;
      }
      pos = Math.min(pos, list.length - 1);
      const index = list[pos];
      const [en, ru] = WORDS[index];
      $('#front').textContent = en;
      $('#back').textContent = flipped ? ru : 'Нажмите, чтобы увидеть перевод';
    }

    function move(delta) {
      const list = cardList($('#filter').value);
      if (!list.length) return;
      pos = (pos + delta + list.length) % list.length;
      flipped = false;
      renderDeck();
    }

    $('#flashcard').addEventListener('click', () => {
      const list = cardList($('#filter').value);
      if (!list.length) return;
      flipped = !flipped;
      renderDeck();
    });

    $('#flashcard').addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        $('#flashcard').click();
      }
    });

    $('#prev').addEventListener('click', () => move(-1));
    $('#next').addEventListener('click', () => move(1));
    $('#repeat').addEventListener('click', () => move(1));

    $('#know').addEventListener('click', () => {
      const list = cardList($('#filter').value);
      if (!list.length) return;
      const idx = list[pos];
      setStatus(idx, 'known');
      move(1);
    });

    $('#filter').addEventListener('change', () => {
      pos = 0;
      flipped = false;
      renderDeck();
    });

    $('#shuffle').addEventListener('click', () => {
      deck = deck.sort(() => Math.random() - 0.5);
      pos = 0;
      flipped = false;
      renderDeck();
    });

    function renderDict() {
      const q = $('#search').value.toLowerCase();
      const list = WORDS.filter(([en, ru]) => {
        return !q || en.toLowerCase().includes(q) || ru.toLowerCase().includes(q);
      });
      $('#dictList').innerHTML = list.map(([en, ru], i) => {
        const index = WORDS.indexOf([en, ru]);
        const known = !!status[index];
        return `<div class="row"><div><strong>${en}</strong><br><span class="muted">${ru}</span></div><button type="button" data-index="${index}">${known ? 'Изучено' : 'Новый'}</button></div>`;
      }).join('') || '<div class="row"><div class="muted">Ничего не найдено</div></div>';

      $('#dictList').querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.index);
          setStatus(idx, status[idx] ? null : 'known');
        });
      });
    }

    $('#search').addEventListener('input', renderDict);

    function newQuestion() {
      const idx = Math.floor(Math.random() * WORDS.length);
      const [en, ru] = WORDS[idx];
      const choices = [ru];
      while (choices.length < 4) {
        const randomWord = WORDS[Math.floor(Math.random() * WORDS.length)][1];
        if (!choices.includes(randomWord)) choices.push(randomWord);
      }
      choices.sort(() => Math.random() - 0.5);

      $('#question').textContent = en;
      $('#options').innerHTML = choices.map(value => `<button class="opt" type="button" data-answer="${value}">${value}</button>`).join('');
      $('#options').querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const chosen = btn.dataset.answer;
          const correct = ru;
          const isCorrect = chosen === correct;
          if (isCorrect) {
            quizScore++;
            $('#score').textContent = `${quizScore} правильных`;
            $('#feedback').innerHTML = '<span class="good">Верно</span>';
          } else {
            $('#feedback').innerHTML = `<span class="bad">Неверно</span> — правильный ответ: <strong>${correct}</strong>`;
          }
          setTimeout(() => {
            $('#feedback').textContent = '';
            newQuestion();
          }, 1000);
        });
      });
    }

    $('#startQuiz').addEventListener('click', () => {
      quizScore = 0;
      $('#score').textContent = '0 правильных';
      newQuestion();
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
        document.querySelectorAll('.panel').forEach(panel => panel.classList.toggle('active', panel.id === tab.dataset.tab));
      });
    });

    updateProgress();
    renderDeck();
    renderDict();
  </script>
</body>
</html>
